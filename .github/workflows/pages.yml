# The web patcher on GitHub Pages: docs/, which holds the patch release.py puts there (so the page
# downloads it from its own site), plus version_number.txt and the translation page's text, made
# from translation/ so it always matches the patch's.
#
# It runs on pushes to main only. A release's run would be on its tag, which the github-pages
# environment refuses ("Tag v1.0 is not allowed to deploy"), and pushing the patch deploys it.
name: Deploy the web patcher

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "version_number.txt"
      - "translation/**"
      - "tools/export_translation.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          version="$(tr -d '[:space:]' < version_number.txt)"
          patch="Deltora_Quest_DS_english_patch_full_button_control_v${version}.bps"
          mkdir site
          cp -r docs/. site/
          cp version_number.txt site/
          python3 tools/export_translation.py site/translation.json
          [ -f "site/${patch}" ] || echo "::warning::No docs/${patch}: run release.py and commit it, or the patcher can't patch"
          ls -l site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
